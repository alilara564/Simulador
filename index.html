<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito</title>
    <link rel="stylesheet" href="simulador.css">
</head>
<body>
 
    <div class="container">
        <h1>Simulador de Crédito</h1>
        <img src="logo.png" alt="Logo del Banco" width="200">
        
        <h2>Datos financieros</h2>

        <label for="txtArriendo">Arriendo:</label>
        <input type="text" id="txtArriendo" value=" ">
        <small class="error" id="error-txtArriendo"></small>

        <label for="txtAlimentacion">Alimentacion:</label>
        <input type="text" id="txtAlimentacion" value=" ">
        <small class="error" id="error-txtAlimentacion"></small>

        <label for="txtVarios">Varios:</label>
        <input type="text" id="txtVarios" value=" ">
        <small class="error" id="error-txtVarios"></small>

        <p>Suma de los tres campos anteriores: <span id="spnSuma" ></span></p>


        <label for="txtIngresos">Ingresos:</label>
        <input type="text" id="txtIngresos" value="1000">
        <small class="error" id="error-txtIngresos"></small>
 
        <label for="txtEgresos">Egresos:</label>
        <input type="text" id="txtEgresos" value="600">
        <small class="error" id="error-txtEgresos"></small>

 
        <p>Disponible: <span id="spnDisponible" ></span></p>
        <p>Capacidad de pago mensual: <span id="spnCapacidadPago"></span></p>
 
        <h2>Solicitud de crédito</h2>
        <label for="txtMonto">Monto:</label>
        <input type="text" id="txtMonto" value="2000">
        <small class="error" id="error-txtMonto"></small>
 
        <label for="txtPlazo">Plazo en años:</label>
        <input type="text" id="txtPlazo" value="1">
        <small class="error" id="error-txtPlazo"></small>
 
        <label for="txtTasaInteres">Tasa de interés:</label>
        <input type="text" id="txtTasaInteres" value="10">
        <small class="error" id="error-txtTasaInteres"></small>
 
        <p>Interés a pagar: <span id="spnInteresPagar"></span></p>
        <p>Total préstamo: <span id="spnTotalPrestamo"></span></p>
        <p>Cuota mensual: <span id="spnCuotaMensual"></span></p>
        <p>Estado de crédito: <span id="spnEstadoCredito">ANALIZANDO...</span></p>
 
        <div class="buttons">
            <button id="btnCalcularCredito" onclick="calcular()">Calcular Crédito</button>
            <button id="btnReiniciar" onclick="reiniciar()">Reiniciar</button>
        </div>
    </div>
 
 <script src="simulador.js"></script>
 <script src="funciones.js"></script>
</body>
</html>
